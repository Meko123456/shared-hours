name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS because the iOS targets need it — and running the suite on a second platform is most of
    # the point here, since that is where the time-zone database is a different implementation.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # First, because it is the cheapest failure to read.
      - name: Check the public API has not changed by accident
        run: ./gradlew apiCheck --stacktrace

      # Every declared target is covered: jvm and iosSimulatorArm64 run the suite, iosArm64 cannot
      # run on a runner so it is compiled, and assemble builds the Android artifact.
      - name: Test and build every target
        run: |
          ./gradlew :hours:jvmTest \
                    :hours:iosSimulatorArm64Test \
                    :hours:compileKotlinIosArm64 \
                    :hours:assemble --stacktrace

      # The only place the library is called from outside its own tests.
      - name: Run the sample
        run: ./gradlew :sample:run --stacktrace

      - name: Upload the test report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: hours/build/reports/tests/
